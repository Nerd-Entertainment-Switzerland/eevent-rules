name: Build

on:
  push:
    branches: [ master ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_docs:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.161.1'
          extended: true

      - name: Build
        shell: pwsh
        run: |
          ./tasks.ps1 sync-content
          ./tasks.ps1 build

      - name: Set CNAME
        run: |
          mkdir -p ./public
          echo "rules.eevent.ch" > ./public/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          host: rules.eevent.ch

      - name: Upload page artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
